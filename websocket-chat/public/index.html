<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat Room</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
    #login { display: block; }
    #chat { display: none; }
    #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin: 20px 0; }
    .message { margin: 5px 0; padding: 8px; border-radius: 3px; }
    .message.user { background: #e3f2fd; }
    .message.system { background: #f5f5f5; color: #666; font-style: italic; }
    .message .name { font-weight: bold; margin-right: 8px; }
    .message .time { font-size: 0.8em; color: #999; margin-left: 8px; }
    input { padding: 8px; }
    button { padding: 8px 16px; }
    #status { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="login">
    <h1>WebSocket Chat Room</h1>
    <input id="nameInput" type="text" placeholder="ユーザー名を入力" autofocus>
    <button onclick="connect()">参加</button>
  </div>

  <div id="chat">
    <h1>WebSocket Chat Room</h1>
    <div id="status"></div>
    <div id="messages"></div>
    <input id="messageInput" type="text" placeholder="メッセージを入力">
    <button onclick="sendMessage()">送信</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
